version: '3.8'
services:
  web-auth-service:
    image: adameds/web-auth-service:dev
    container_name: web-auth-service-dev
    ports:
      - 8081:8081
    networks:
      - adameds
    environment:
      # Application config
      API_URL_VERSION: v3

      # Database config
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_DIALECT: ${DB_DIALECT}
      DB_NAME: ${DB_NAME}
      DB_POOL: ${DB_POOL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}

      # Redis Configuration
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DATABASE: ${REDIS_DATABASE}
    volumes:
      - type: bind
        source: /home/admin/adameds/private.key
        target: /web-auth/private.key
      - type: bind
        source: /home/admin/adameds/public.key
        target: /web-auth/public.key
    restart: always
networks:
  adameds:
    driver: bridge