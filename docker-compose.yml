version: '3.8'
services:
  web-auth-service:
    build:
      dockerfile: Dockerfile
      context: ./
    image: web-auth-service:dev
    container_name: web-auth-service
    ports:
      - 8081:8081
    networks:
      - adameds
    environment:
      # Application config
      APPLICATION_PORT: 8081
      APPLICATION_HOST: 0.0.0.0
      API_URL_VERSION: v3

      # Database config
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_DIALECT: ${DB_DIALECT}
      DB_NAME: ${DB_NAME}
      DB_POOL: ${DB_POOL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}

      # Redis Configuration
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
    volumes:
      - type: bind
        source: ./private.key
        target: /web-auth/private.key
      - type: bind
        source: ./public.key
        target: /web-auth/public.key
networks:
  adameds:
    driver: bridge
