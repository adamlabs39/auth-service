version: '3.3'
services:
  postgres:
    image: postgres:latest
    ports:
      - 5432:5432
    restart: no
    networks:
      - adameds
    volumes:
      - pg-data-volume:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=secreet_pass
      - POSTGRES_USER=alliano-dev
volumes:
  pg-data-volume: {}
networks:
  adameds:
    driver: bridge