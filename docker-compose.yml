version: '3.8'
services:
  web-auth-service:
    build:
      dockerfile: Dockerfile
      context: ./
    image: web-auth-service:dev
    container_name: web-auth-service
    ports:
      - 8081:8081
    networks:
      - adameds
    environment:
      - APPLICATION_PORT=8081
      - APPLICATION_HOST=0.0.0.0
    volumes:
      - type: bind
        source: ./private.key
        target: /web-auth/private.key
      - type: bind
        source: ./public.key
        target: /web-auth/public.key
networks:
  adameds:
    driver: bridge