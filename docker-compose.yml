services:
  web-auth-service:
    build: 
      context: ./
      dockerfile: Dockerfile
      no_cache: true
    image: adameds/web-auth-service:dev
    container_name: web-auth-service-dev
    ports:
      - 8081:8081
    networks:
      - adameds
    environment:
      # Application config
      DOTENV_KEY: ${DOTENV_KEY}
      APPLICATION_PORT: ${APPLICATION_PORT}
      APPLICATION_HOST: ${APPLICATION_HOST}
      API_VERSION: ${API_VERSION}
    volumes:
      - type: bind
        source: /home/admin/adameds/.env.vault
        target: /web-auth/.env.vault
    restart: always
networks:
  adameds:
    driver: bridge