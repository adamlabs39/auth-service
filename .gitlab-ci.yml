stages:
  - build
  - deploy

build-image:
  stage: build
  before_script:
   - docker compose down --rmi all
  script:
    - docker build -t web-auth-service:dev ./
    - echo "Success build image ...."

deploy-app:
  stage: deploy
  before_script:
    - echo "@adameds:registry=https://gitlab.com/api/v4/groups/93029767/-/packages/npm/" >> .npmrc
    - echo "//gitlab.com/api/v4/groups/93029767/-/packages/npm/:_authToken=$AUTH_TOKEN" >> .npmrc
  script:
    - docker compose --env-file /home/admin/adameds/.env up -d
    - echo "success deploy...."