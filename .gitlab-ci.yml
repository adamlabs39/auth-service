stages:
  - build-deploy

build-deplly:
  stage: build-deploy
  before_script:
   - docker compose --env-file /home/admin/adameds/.env-web-auth down --rmi all
   - echo "@adameds:registry=https://gitlab.com/api/v4/groups/93029767/-/packages/npm/" >> .npmrc
   - echo "//gitlab.com/api/v4/groups/93029767/-/packages/npm/:_authToken=$AUTH_TOKEN" >> .npmrc
  script:
    - docker compose --env-file /home/admin/adameds/.env-web-auth up -d
  only:
    - dev-deployment