stages:
  - build
  - deploy

build-image:
  stage: build
  only:
    - dev-deployment
  before_script:
   - echo "@adameds:registry=https://gitlab.com/api/v4/groups/93029767/-/packages/npm/" >> .npmrc
   - echo "//gitlab.com/api/v4/groups/93029767/-/packages/npm/:_authToken=$AUTH_TOKEN" >> .npmrc
   - docker compose --env-file /home/admin/adameds/.env down --rmi all
  script:
    - docker build -t adameds/web-auth-service:dev ./ --no-cache
    - echo "Success build image ...."

deploy-app:
  stage: deploy
  script:
    - docker compose --env-file /home/admin/adameds/.env up -d
    - echo "success deploy...."
  only:
    - dev-deployment