version: "3.3"
services:
  postgres:
    container_name: postgresql
    image: postgres:latest
    ports:
      - 5432:5432
    restart: always
    networks:
        - adameds
    environment:
      - POSTGRES_PASSWORD=resman56adam
      - POSTGRES_DB=adameds
      - POSTGRES_USER=wmi_user_db
  redis:
    container_name: redis
    image: redis:latest
    command:
      - bash
      - -c
      - redis-server /usr/local/etc/redis/redis.conf
    ports:
      - 6379:6379
    volumes:
      - type: bind
        source: ./redis.conf
        target: /usr/local/etc/redis/redis.conf
    networks:
      - adameds
networks:
  adameds:
    driver: bridge
